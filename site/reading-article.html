<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>導讀 · Gary 的場景記憶架構</title>
<meta name="description" content="導讀文章。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/vars-light.css">
<link rel="stylesheet" href="/assets/vars-dark.css">
<link rel="stylesheet" href="/assets/aurora-components.css">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="reading">
<div class="orbs"><div class="orb orb-gold orb-a"></div><div class="orb orb-mauve orb-b"></div><div class="orb orb-purple orb-c"></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">Gary 的場景記憶架構</div></div>
    <nav class="nav" id="nav"></nav>
    <div>
      <div class="label" style="margin-bottom:var(--space-sm)">導讀</div>
      <div class="reading" id="reading"></div>
    </div>
    <div style="margin-top:auto" class="row">
      <button class="btn btn-secondary" id="theme">切換亮／暗</button>
    </div>
  </aside>
  <main class="main">
    <div class="article-wrap">
      <div id="article"></div>
      <nav class="pager" id="pager"></nav>
    </div>

  </main>
</div>
<script src="/assets/site.js"></script>
<script>

window.pageInit = async function(S){
  const slug = location.pathname.split('/').filter(Boolean).pop();
  const r = S.reading.find(x => x.slug === slug) || S.reading[0];
  const box = document.getElementById('article');
  if (r && r.body){
    box.innerHTML = `<div class="article glass card"><div class="label" style="margin-bottom:var(--space-md)">${esc(r.title)}</div>${md(r.body)}</div>`;
  } else {
    box.innerHTML = `<div class="empty"><div class="big">${esc(r ? r.title : '')}</div>這一篇還沒寫。內容會由作者補上。</div>`;
  }
  const i = S.reading.findIndex(x => x.slug === (r && r.slug));
  const prev = S.reading[i-1], next = S.reading[i+1];
  document.getElementById('pager').innerHTML =
    `<div>${prev?`<a class="btn btn-secondary" href="${BASE}/reading/${esc(prev.slug)}">← ${esc(prev.title)}</a>`:''}</div>
     <div>${next?`<a class="btn btn-secondary" href="${BASE}/reading/${esc(next.slug)}">${esc(next.title)} →</a>`:''}</div>`;
  document.title = (r ? r.title : '導讀') + ' · Gary 的場景記憶架構';
};

</script>
</body>
</html>
