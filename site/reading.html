<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>導讀 · Gary 的場景記憶架構</title>
<meta name="description" content="從這裡讀進整套架構。每篇一題。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/vars-light.css">
<link rel="stylesheet" href="/assets/vars-dark.css">
<link rel="stylesheet" href="/assets/aurora-components.css">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="reading">
<div class="orbs"><div class="orb orb-gold orb-a"></div><div class="orb orb-mauve orb-b"></div><div class="orb orb-purple orb-c"></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">Gary 的場景記憶架構</div></div>
    <nav class="nav" id="nav"></nav>
    <div>
      <div class="label" style="margin-bottom:var(--space-sm)">導讀</div>
      <div class="reading" id="reading"></div>
    </div>
    <div style="margin-top:auto" class="row">
      <button class="btn btn-secondary" id="theme">切換亮／暗</button>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="title">
        <h1>導讀</h1>
        <div class="desc">從這裡讀進整套架構。每篇一題，讀完知道自己能做什麼。</div>
      </div>
    </div>
    <div class="reading-list" id="list"></div>

  </main>
</div>
<script src="/assets/site.js"></script>
<script>

window.pageInit = function(S){
  document.getElementById('list').innerHTML = S.reading.map(r => `
    <a class="rl glass card card-hover" href="${BASE}/reading/${esc(r.slug)}">
      <span class="rl-n mono">${String(r.seq).padStart(2,'0')}</span>
      <span class="rl-t">
        <span class="rl-title">${esc(r.title)}</span>
        <span class="rl-st ${r.status==='published'?'pub':''}">${r.status==='published'?'已發布':'待撰寫'}</span>
      </span>
      <span class="rl-arrow">→</span>
    </a>`).join('');
};

</script>
</body>
</html>
